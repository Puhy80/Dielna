<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dielňa – záznam práce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --alu:#D5DADE; --alu2:#C3CACF; --ink:#1C2B36; --muted:#5A6873;
  --tile:#F4F6F7; --amber:#E39B2D; --green:#2E8B57; --red:#B8433A;
  --w1:#2F6FB0; --w2:#B5502F; --w3:#5B7F2A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--alu);color:var(--ink);font-family:Barlow,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr 1.6fr 1.3fr;gap:10px;padding:12px 14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font:700 1.5rem/1 "Barlow Condensed",sans-serif;margin:0;letter-spacing:.01em}
#clock{font:600 1.5rem/1 "Barlow Condensed",sans-serif;color:var(--muted)}
#gear{background:none;border:0;font-size:1.4rem;color:var(--muted);padding:6px 10px;cursor:pointer}
section{min-height:0;display:flex;flex-direction:column}
section h2{font:600 1.05rem/1 "Barlow Condensed",sans-serif;color:var(--muted);margin:0 0 6px 2px}
.grid{flex:1;min-height:0;display:grid;gap:8px;overflow-y:auto;align-content:start}
#workers{grid-template-columns:repeat(3,1fr);align-content:stretch}
#orders{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
#ops{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
button.t{font-family:inherit;color:var(--ink);background:var(--tile);border:3px solid transparent;border-radius:10px;
  padding:10px 12px;text-align:left;cursor:pointer;box-shadow:0 2px 0 var(--alu2);min-height:64px;
  transition:transform .06s, border-color .12s, background .12s}
button.t:active{transform:translateY(2px);box-shadow:none}
button.t:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.t[disabled]{opacity:.35}
.w{display:flex;flex-direction:column;justify-content:center;border-left-width:12px!important}
.w .n{font:700 2.1rem/1 "Barlow Condensed",sans-serif}
.w .s{font-size:.95rem;color:var(--muted);margin-top:6px;min-height:1.2em}
.w.sel{color:#fff}
.o .n{font:700 1.45rem/1 "Barlow Condensed",sans-serif}
.o .s{font-size:.85rem;color:var(--muted);margin-top:4px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.o.sel{background:var(--ink);color:#fff}.o.sel .s{color:#C9D3DA}
.p{font:600 1.3rem/1.1 "Barlow Condensed",sans-serif;display:flex;align-items:center}
.p.np{background:var(--alu2)}
.p:not([disabled]){border-color:var(--amber)}
.hint{font-size:.95rem;color:var(--muted);margin-left:8px;font-family:Barlow,sans-serif;font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);
  background:var(--green);color:#fff;font:600 1.4rem/1.2 "Barlow Condensed",sans-serif;padding:16px 26px;border-radius:12px;
  max-width:92vw;transition:transform .25s;z-index:5;text-align:center}
#toast.on{transform:translate(-50%,0)} #toast.err{background:var(--red)}
#setup{position:fixed;inset:0;background:var(--alu);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#setup .box{background:var(--tile);border-radius:12px;padding:24px;max-width:520px;width:100%}
#setup h2{font:700 1.6rem "Barlow Condensed",sans-serif;margin:0 0 8px}
#setup p{margin:0 0 14px;color:var(--muted);line-height:1.45}
#setup input{width:100%;font:1rem Barlow,sans-serif;padding:12px;border:2px solid var(--alu2);border-radius:8px}
#setup .row{display:flex;gap:10px;margin-top:14px}
#setup button{font:600 1.1rem "Barlow Condensed",sans-serif;padding:12px 18px;border-radius:8px;border:0;background:var(--ink);color:#fff;cursor:pointer}
#setup button.sec{background:var(--alu2);color:var(--ink)}
.empty{color:var(--muted);padding:8px 2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-height:700px){.app{grid-template-rows:auto 1fr 1.4fr 1.3fr}.w .n{font-size:1.7rem}}
</style>
</head>
<body>
<div class="app">
  <header><h1>Dielňa – záznam práce</h1><div style="display:flex;align-items:center;gap:6px"><span id="clock"></span><button id="gear" aria-label="Nastavenie">⚙</button></div></header>
  <section><h2>Kto?</h2><div class="grid" id="workers"></div></section>
  <section><h2>Zákazka</h2><div class="grid" id="orders"><div class="empty">Načítavam zákazky…</div></div></section>
  <section><h2>Operácia <span class="hint" id="opHint">Najprv vyber meno</span></h2><div class="grid" id="ops"></div></section>
</div>
<div id="toast"></div>
<div id="setup"><div class="box">
  <h2>Pripojenie k Airtable</h2>
  <p>Vlož prístupový token pre base Dochádzka. Uloží sa iba v tomto tablete.</p>
  <input id="tok" type="password" placeholder="pat…" autocomplete="off">
  <div class="row"><button id="saveTok">Uložiť</button><button class="sec" id="cancelTok">Zrušiť</button></div>
</div></div>

<script>
const BASE='appBy499CfXWspEwm';
const T={workers:'tbl3hG7ehCANkuHCG',ops:'tbljQUMy8DlNERxru',orders:'tblrEGT9sFE97IF1b',log:'tblQaMveOs5sVeNoZ'};
const F={wName:'fldS120pHafSy2Cwc',wActive:'fldGEY11gUYC0AqXP',
  opName:'fldjPiTAo9ARAWuhe',opOrder:'fldzmeSdJrwQi3DNT',opType:'fldKGMlX6MjImkoj9',
  oNum:'flduZ4pChX4FzHI7l',oCust:'fldWGGxa171HyXy5h',oAct:'fldM3yAruVD9yvAir',
  lOrder:'fldbG9cGhF5WPrbqK',lWorker:'fldVTH1WHhGaqLtSs',lOp:'fldtkOLsp20sXrUdJ',lEnd:'fldgpWcdOZKtPGY5v',lStart:'fldlsVUbMvmFQdSjI'};
const WCOL=['var(--w1)','var(--w2)','var(--w3)','#7A4FA0','#2A8A8A'];

let token=null; try{token=localStorage.getItem('dielna_token')}catch(e){}
let workers=[],ops=[],orders=[],open={};
let sel={w:null,o:null}; let idle;
const $=id=>document.getElementById(id);

async function api(path,opts={}){
  const r=await fetch('https://api.airtable.com/v0/'+BASE+'/'+path,{...opts,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});
  if(r.status===401||r.status===403){showSetup();throw new Error('Token nie je platný alebo nemá prístup k base Dochádzka.')}
  if(!r.ok) throw new Error('Airtable vrátil chybu '+r.status);
  return r.json();
}
async function all(table,params=''){
  let out=[],offset='';
  do{const d=await api(table+'?returnFieldsByFieldId=true&pageSize=100'+params+(offset?'&offset='+offset:''));out=out.concat(d.records);offset=d.offset||''}while(offset);
  return out;
}

async function loadStatic(){
  const [w,o]=await Promise.all([all(T.workers),all(T.ops)]);
  workers=w.filter(r=>r.fields[F.wActive]).map(r=>({id:r.id,name:r.fields[F.wName]||'?'})).sort((a,b)=>a.name.localeCompare(b.name,'sk'));
  ops=o.map(r=>({id:r.id,name:r.fields[F.opName]||'?',ord:r.fields[F.opOrder]??999,prod:r.fields[F.opType]!=='Neproduktívne'})).sort((a,b)=>a.ord-b.ord);
}
async function loadOrders(){
  const o=await all(T.orders);
  orders=o.map(r=>({id:r.id,num:r.fields[F.oNum]||'?',cust:(r.fields[F.oCust]||'').trim(),act:String(r.fields[F.oAct]||'').split('\n')[0].trim()}))
    .sort((a,b)=>a.num.localeCompare(b.num,'sk',{numeric:true}));
}
async function loadOpen(){
  const f=encodeURIComponent("AND({Koniec}=BLANK(),IS_AFTER(CREATED_TIME(),DATEADD(TODAY(),-1,'days')))");
  const r=await all(T.log,'&filterByFormula='+f);
  open={};
  r.forEach(x=>{const w=(x.fields[F.lWorker]||[])[0];if(!w)return;
    const prev=open[w]; if(!prev||x.createdTime>prev.t) open[w]={t:x.createdTime,op:(x.fields[F.lOp]||[])[0],o:(x.fields[F.lOrder]||[])[0]}});
}

function hm(iso){return new Date(iso).toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'})}
function status(wid){
  const s=open[wid]; if(!s) return 'nič rozrobené';
  const op=ops.find(x=>x.id===s.op), o=orders.find(x=>x.id===s.o);
  return (op?op.name:'?')+(o?' – '+o.num:'')+' od '+hm(s.t);
}

function render(){
  const W=$('workers'); W.innerHTML='';
  workers.forEach((w,i)=>{const b=document.createElement('button');b.className='t w'+(sel.w===w.id?' sel':'');
    const c=WCOL[i%WCOL.length]; b.style.borderLeftColor=c; if(sel.w===w.id){b.style.background=c;b.style.borderColor=c}
    b.innerHTML='<span class="n"></span><span class="s"></span>';b.querySelector('.n').textContent=w.name;b.querySelector('.s').textContent=status(w.id);
    if(sel.w===w.id) b.querySelector('.s').style.color='#E8EEF2';
    b.onclick=()=>{sel.w=sel.w===w.id?null:w.id;touch();render()};W.appendChild(b)});
  const O=$('orders'); O.innerHTML='';
  if(!orders.length) O.innerHTML='<div class="empty">Žiadne nevyrobené hliníkové zákazky.</div>';
  orders.forEach(o=>{const b=document.createElement('button');b.className='t o'+(sel.o===o.id?' sel':'');
    b.innerHTML='<div class="n"></div><div class="s"></div>';b.querySelector('.n').textContent=o.num;
    b.querySelector('.s').textContent=[o.cust,o.act].filter(Boolean).join(', ');
    b.onclick=()=>{sel.o=sel.o===o.id?null:o.id;touch();render()};O.appendChild(b)});
  const P=$('ops'); P.innerHTML='';
  ops.forEach(op=>{const b=document.createElement('button');b.className='t p'+(op.prod?'':' np');b.textContent=op.name;
    b.disabled=!sel.w||(op.prod&&!sel.o);b.onclick=()=>log(op);P.appendChild(b)});
  $('opHint').textContent=!sel.w?'Najprv vyber meno':(!sel.o?'Vyber zákazku, alebo pauzu / koniec dňa':'Ťukni na operáciu a začne sa');
}

let busy=false;
async function log(op){
  if(busy||!sel.w) return; busy=true;
  const w=workers.find(x=>x.id===sel.w), o=op.prod?orders.find(x=>x.id===sel.o):null;
  const fields={[F.lWorker]:[sel.w],[F.lOp]:[op.id]}; if(o) fields[F.lOrder]=[o.id];
  try{
    const r=await api(T.log,{method:'POST',body:JSON.stringify({records:[{fields}],returnFieldsByFieldId:true})});
    const t=r.records[0].createdTime;
    open[sel.w]= op.name==='Koniec dňa'?undefined:{t,op:op.id,o:o?o.id:null};
    toast(w.name+': '+op.name+(o?' – '+o.num:'')+' od '+hm(t));
    sel={w:null,o:null}; render();
  }catch(e){toast(e.message+' Skús znova.',true)}
  busy=false;
}

function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='on'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className=err?'err':'',err?6000:3500)}
function touch(){clearTimeout(idle);idle=setTimeout(()=>{sel={w:null,o:null};render()},45000)}
function tick(){$('clock').textContent=new Date().toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'})}

function showSetup(){$('setup').style.display='flex';$('tok').value='';$('cancelTok').style.display=token?'':'none'}
$('saveTok').onclick=()=>{const v=$('tok').value.trim();if(!v)return;token=v;try{localStorage.setItem('dielna_token',v)}catch(e){}$('setup').style.display='none';start()};
$('cancelTok').onclick=()=>$('setup').style.display='none';
let gearT; $('gear').onpointerdown=()=>{gearT=setTimeout(showSetup,1500)}; $('gear').onpointerup=()=>clearTimeout(gearT);

async function refresh(){try{await Promise.all([loadOrders(),loadOpen()]);render()}catch(e){toast(e.message,true)}}
async function start(){
  try{await loadStatic();await refresh()}catch(e){toast(e.message,true)}
}
tick();setInterval(tick,10000);
setInterval(()=>{if(token&&!busy)refresh()},120000);
if(!token) showSetup(); else start();
</script>
</body>
</html>
