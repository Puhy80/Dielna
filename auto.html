<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16302d">
<title>Jazda autom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ee; --ink:#16302d; --muted:#5b6f6b; --line:#cfd8d4; --panel:#ffffff;
  --ev:#1f8a70; --gas:#a87a0c; --stop:#b3261e; --dial:#16302d; --dial-ink:#f3f6f4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1c1a; --ink:#e6eeeb; --muted:#93a6a1; --line:#2a3d39; --panel:#162724;
         --dial:#e6eeeb; --dial-ink:#0f1c1a; --ev:#3fb894; --gas:#e0b04a; --stop:#e5534b; }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.4}
main{max-width:460px;margin:0 auto;padding:22px 18px 36px}
h1{font:700 2.1rem/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.cars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.car{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;
  padding:14px 12px;text-align:left;font:inherit;cursor:pointer}
.car b{display:block;font-size:1.15rem}
.car span{color:var(--muted);font-size:.9rem}
.car[aria-pressed="true"].ev{border-color:var(--ev);box-shadow:inset 0 0 0 1px var(--ev)}
.car[aria-pressed="true"].gas{border-color:var(--gas);box-shadow:inset 0 0 0 1px var(--gas)}
.lbl{display:block;font-weight:600;margin-bottom:8px}
.odo{display:flex;align-items:baseline;gap:8px;background:var(--dial);border-radius:12px;padding:8px 16px}
.odo input{flex:1;min-width:0;background:transparent;border:0;color:var(--dial-ink);
  font:700 2.6rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.14em;
  font-variant-numeric:tabular-nums;outline:none;padding:2px 0}
.odo input::placeholder{color:var(--dial-ink);opacity:.25}
.odo small{color:var(--dial-ink);opacity:.7}
.photo{margin:14px 0 24px;display:flex;align-items:center;gap:12px}
.photo label{flex:1;border:2px dashed var(--line);border-radius:12px;padding:13px;
  text-align:center;font-weight:600;cursor:pointer}
.photo img{width:58px;height:58px;object-fit:cover;border-radius:8px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.go{width:100%;border:0;border-radius:16px;padding:20px;color:#fff;background:var(--ev);
  font:700 1.4rem "Barlow Condensed","Arial Narrow",sans-serif;cursor:pointer}
.go.stop{background:var(--stop)}
.go:disabled{opacity:.5;cursor:wait}
.ride{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--ev);
  border-radius:14px;padding:16px 18px;margin-bottom:24px}
.ride.gas{border-left-color:var(--gas)}
.ride .t{font:700 3rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;margin:6px 0}
.ride p{margin:0;color:var(--muted)}
.result{font:700 2.4rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:8px 0 4px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;padding:14px 0;cursor:pointer}
.msg{min-height:1.4em;margin:14px 0 0;font-weight:600}
.msg.err{color:var(--stop)}
.month{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted)}
input.key{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;font:inherit;background:var(--panel);color:var(--ink);margin-bottom:12px}
:focus-visible{outline:3px solid var(--ev);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Jazda autom</h1>
  <p class="sub">Zapisuj len súkromné jazdy. Čas sa uloží sám.</p>

  <section id="vKey" hidden>
    <p>Tento odkaz nemá prístup do evidencie. Vlož prístupový kľúč alebo otvor odkaz, ktorý si dostal.</p>
    <input class="key" id="keyIn" placeholder="pat…" autocomplete="off">
    <button class="go" id="btnKey">Uložiť kľúč</button>
  </section>

  <section id="vStart" hidden>
    <div class="cars" role="group" aria-label="Auto">
      <button class="car ev" data-car="Elektro" aria-pressed="false"><b>Elektro</b><span>0,08 € za km</span></button>
      <button class="car gas" data-car="Spaľovacie" aria-pressed="false"><b>Spaľovacie</b><span>0,16 € za km</span></button>
    </div>
    <label class="lbl" for="kmStart">Stav tachometra pri odchode</label>
    <div class="odo"><input id="kmStart" inputmode="numeric" autocomplete="off" placeholder="000000"><small>km</small></div>
    <div class="photo">
      <label>Odfotiť tachometer<input class="vh" type="file" accept="image/*" capture="environment" id="ph1"></label>
      <img id="pv1" alt="" hidden>
    </div>
    <button class="go" id="btnStart">Začať jazdu</button>
  </section>

  <section id="vRide" hidden>
    <div class="ride" id="rideBox">
      <p id="rFrom"></p>
      <div class="t" id="rElapsed">0:00</div>
      <p id="rInfo"></p>
    </div>
    <label class="lbl" for="kmEnd">Stav tachometra po príchode</label>
    <div class="odo"><input id="kmEnd" inputmode="numeric" autocomplete="off" placeholder="000000"><small>km</small></div>
    <div class="photo">
      <label>Odfotiť tachometer<input class="vh" type="file" accept="image/*" capture="environment" id="ph2"></label>
      <img id="pv2" alt="" hidden>
    </div>
    <button class="go stop" id="btnStop">Ukončiť jazdu</button>
    <button class="link" id="btnCancel">Jazdu som spustil omylom, zrušiť</button>
  </section>

  <section id="vDone" hidden>
    <p>Jazda je zapísaná.</p>
    <div class="result" id="dResult"></div>
    <p class="sub" id="dInfo"></p>
    <button class="go" id="btnNew">Hotovo</button>
  </section>

  <p class="msg" id="msg" role="status"></p>
  <p class="month" id="month" hidden></p>
</main>

<script>
const BASE = 'appBy499CfXWspEwm', TABLE = 'tblo9BP5silcc0QWP';
const F = { datum:'fldU2tCQOM9PZNfTJ', auto:'fldEZzXOOa2QTnqgl', kmZ:'fldDqyTlngILy4net', kmK:'fldt08TiF952rl9eW',
            foto:'fldkDYal8yHufhwYK', zac:'fld57C0qI3fcmODRX', kon:'fldsBLPMBVlA6ey13', eur:'fldACF5llebGfaPcW', km:'fldS3eXR7hZc2Zgbw' };
const RATE = { 'Elektro':0.08, 'Spaľovacie':0.16 };
const $ = id => document.getElementById(id);
let KEY = null, car = null, open = null, timer = null, photos = {};

function readKey(){
  const m = location.hash.match(/key=([^&]+)/);
  if (m) {
    KEY = decodeURIComponent(m[1]);
    try { localStorage.setItem('autoKey', KEY); history.replaceState(null, '', location.pathname); } catch(e) {}
    return;
  }
  try { KEY = localStorage.getItem('autoKey'); } catch(e) { KEY = null; }
}

const eur = n => n.toLocaleString('sk-SK', { style:'currency', currency:'EUR' });
const kmFmt = n => n.toLocaleString('sk-SK');
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const num = v => parseInt(String(v).replace(/\D/g,''), 10);

function show(view){ ['vKey','vStart','vRide','vDone'].forEach(v => $(v).hidden = v !== view); }
function say(t, err){ $('msg').textContent = t || ''; $('msg').className = 'msg' + (err ? ' err' : ''); }
function busy(b){ document.querySelectorAll('.go').forEach(x => x.disabled = b); }

async function api(path, opts = {}){
  const r = await fetch('https://api.airtable.com/v0/'+BASE+'/'+TABLE+path, {
    ...opts, headers:{ 'Authorization':'Bearer '+KEY, 'Content-Type':'application/json' } });
  if (r.status === 401 || r.status === 403) throw new Error('Kľúč nemá prístup do evidencie. Požiadaj o nový odkaz.');
  if (!r.ok) throw new Error('Zápis sa nepodaril (chyba '+r.status+'). Skús to znova.');
  return r.json();
}

function compress(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
    img.onerror = () => rej(new Error('photo'));
    img.src = url;
  });
}
async function upload(recId, file, name){
  const b64 = await compress(file);
  const r = await fetch('https://content.airtable.com/v0/'+BASE+'/'+recId+'/'+F.foto+'/uploadAttachment', {
    method:'POST', headers:{ 'Authorization':'Bearer '+KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ contentType:'image/jpeg', file:b64, filename:name }) });
  if (!r.ok) throw new Error('photo');
}

function bindPhoto(inputId, prevId){
  $(inputId).addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    photos[inputId] = f;
    const p = $(prevId); p.src = URL.createObjectURL(f); p.hidden = false;
  });
}

function tick(){
  if (!open) return;
  const mins = Math.floor((Date.now() - new Date(open.start)) / 60000);
  $('rElapsed').textContent = Math.floor(mins/60) + ':' + String(mins%60).padStart(2,'0');
}

function showRide(){
  const d = new Date(open.start);
  $('rFrom').textContent = 'Jazda beží od ' + d.toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'}) +
                           ', ' + d.toLocaleDateString('sk-SK');
  $('rInfo').textContent = open.car + ', pri odchode ' + kmFmt(open.km) + ' km';
  $('rideBox').classList.toggle('gas', open.car === 'Spaľovacie');
  $('kmEnd').value = ''; photos.ph2 = null; $('pv2').hidden = true;
  show('vRide'); tick(); clearInterval(timer); timer = setInterval(tick, 20000);
}

async function loadOpen(){
  const f = encodeURIComponent('AND({Začiatok}, {Koniec}=BLANK())');
  const res = await api('?filterByFormula='+f+'&maxRecords=1&returnFieldsByFieldId=true');
  const r = res.records[0];
  open = r ? { id:r.id, start:r.fields[F.zac], car:r.fields[F.auto], km:r.fields[F.kmZ] } : null;
}

async function loadMonth(){
  try {
    const m = today().slice(0,7);
    const res = await api('?filterByFormula='+encodeURIComponent("{Mesiac}='"+m+"'")+'&returnFieldsByFieldId=true&pageSize=100');
    const done = res.records.filter(r => r.fields[F.kon]);
    if (!done.length) { $('month').hidden = true; return; }
    const sumKm = done.reduce((a,r) => a + (r.fields[F.km] || 0), 0);
    const sumEur = done.reduce((a,r) => a + (r.fields[F.eur] || 0), 0);
    const n = done.length, w = n === 1 ? 'jazda' : (n < 5 ? 'jazdy' : 'jázd');
    const name = new Date().toLocaleDateString('sk-SK',{month:'long'});
    $('month').textContent = 'Tento mesiac (' + name + '): ' + n + ' ' + w + ', ' + kmFmt(sumKm) + ' km, na úhradu ' + eur(sumEur) + '.';
    $('month').hidden = false;
  } catch(e) { $('month').hidden = true; }
}

function resetStart(){
  car = null; document.querySelectorAll('.car').forEach(b => b.setAttribute('aria-pressed','false'));
  $('kmStart').value = ''; photos.ph1 = null; $('pv1').hidden = true;
  show('vStart');
}

async function start(){
  const km = num($('kmStart').value);
  if (!car) return say('Vyber, ktorým autom ideš.', true);
  if (!km) return say('Zadaj stav tachometra.', true);
  busy(true); say('Ukladám…');
  try {
    const now = new Date().toISOString();
    const res = await api('', { method:'POST', body: JSON.stringify({ records:[{ fields:{
      [F.datum]:today(), [F.auto]:car, [F.kmZ]:km, [F.zac]:now } }] }) });
    const id = res.records[0].id;
    let note = '';
    if (photos.ph1) { try { await upload(id, photos.ph1, 'odchod-'+km+'.jpg'); } catch(e) { note = ' Fotka sa nenahrala.'; } }
    open = { id, start:now, car, km };
    showRide(); say('Jazda začala. Šťastnú cestu.' + note, !!note);
  } catch(e) { say(e.message, true); }
  busy(false);
}

async function stop(){
  const km = num($('kmEnd').value);
  if (!km) return say('Zadaj stav tachometra po príchode.', true);
  if (km <= open.km) return say('Stav na konci musí byť vyšší ako pri odchode (' + kmFmt(open.km) + ' km).', true);
  busy(true); say('Ukladám…');
  try {
    const now = new Date().toISOString();
    await api('/'+open.id, { method:'PATCH', body: JSON.stringify({ fields:{ [F.kmK]:km, [F.kon]:now } }) });
    let note = '';
    if (photos.ph2) { try { await upload(open.id, photos.ph2, 'prichod-'+km+'.jpg'); } catch(e) { note = 'Fotka sa nenahrala.'; } }
    const dist = km - open.km, cost = Math.round(dist * RATE[open.car] * 100) / 100;
    clearInterval(timer);
    $('dResult').textContent = kmFmt(dist) + ' km, ' + eur(cost);
    $('dInfo').textContent = open.car + ', ' + kmFmt(open.km) + ' až ' + kmFmt(km) + ' km.';
    open = null; show('vDone'); say(note, !!note); loadMonth();
  } catch(e) { say(e.message, true); }
  busy(false);
}

async function cancel(){
  if (!confirm('Zrušiť túto jazdu? Záznam sa vymaže.')) return;
  busy(true);
  try { await api('/'+open.id, { method:'DELETE' }); open = null; clearInterval(timer); resetStart(); say('Jazda je zrušená.'); }
  catch(e) { say(e.message, true); }
  busy(false);
}

document.querySelectorAll('.car').forEach(b => b.addEventListener('click', () => {
  car = b.dataset.car;
  document.querySelectorAll('.car').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  say('');
}));
bindPhoto('ph1','pv1'); bindPhoto('ph2','pv2');
$('btnStart').addEventListener('click', start);
$('btnStop').addEventListener('click', stop);
$('btnCancel').addEventListener('click', cancel);
$('btnNew').addEventListener('click', () => { resetStart(); say(''); });
$('btnKey').addEventListener('click', () => {
  const k = $('keyIn').value.trim(); if (!k) return;
  KEY = k; try { localStorage.setItem('autoKey', k); } catch(e) {}
  init();
});

async function init(){
  if (!KEY) readKey();
  if (!KEY) { show('vKey'); return; }
  say('Načítavam…');
  try { await loadOpen(); say(''); open ? showRide() : resetStart(); loadMonth(); }
  catch(e) { say(e.message, true); show('vKey'); }
}
init();
</script>
</body>
</html>
